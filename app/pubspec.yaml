name: cristalins_assinatura
description: "App de assinatura Cristalins Water Protein (Rio de Janeiro)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  intl: ^0.20.2
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1
  # cr-6-operacao: foto da ocorrência e token de push (sem google-services.json nesta fase).
  image_picker: ^1.2.1
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  # cr-7-qualidade: erros (DSN só por --dart-define=SENTRY_DSN=)
  sentry_flutter: ^9.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/produtos/
    - assets/images/brand/
    - assets/images/hero/
  # Inter + DM Serif Display (SIL OFL 1.1). Nunca SF Pro / SF Symbols.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
          weight: 400
