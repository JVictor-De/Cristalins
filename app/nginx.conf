server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # APK servido pelo site (banner em index.html).
    location ^~ /downloads/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="cristalins-hml.apk"';
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA Flutter: rotas nomeadas caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|wasm|css|png|jpg|jpeg|svg|ico|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
