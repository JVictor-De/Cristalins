server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # APK servido pelo site (banner em index.html).
    location ^~ /downloads/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="cristalins-hml.apk"';
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Termos / privacidade (HTML estatico em web/).
    location = /termos.html {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /privacidade.html {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Raiz e index: sem cache — a maioria abre https://dominio/ (nao /index.html).
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Entrada Flutter (nomes fixos, sem hash no filename).
    # no-cache = revalidar sempre (304 se igual); evita build antigo apos deploy.
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /main.dart.mjs {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /main.dart.wasm {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /AssetManifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /AssetManifest.bin {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /AssetManifest.bin.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /FontManifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Part files do dart2js (main.dart.js_1.part.js, ...).
    location ~* ^/main\.dart\.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Assets / canvaskit: ^~ ganha do regex; cache longo ok (path versionado).
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ^~ /canvaskit/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA Flutter: rotas nomeadas caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
