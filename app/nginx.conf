server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA Flutter: rotas nomeadas caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|wasm|css|png|jpg|jpeg|svg|ico|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
