org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Path do repo no Windows pode ter acento (ex.: João) — sem isto o AGP aborta o build.
android.overridePathCheck=true
# AGP 9 + Flutter: manter newDsl=false (newDsl=true quebra o flutter-gradle-plugin).
# Com newDsl=false, resValue() nos flavors é proibido — nomes via manifestPlaceholders.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
